<div id="delete-experience-{{ experience.id }}" class="project-delete-modal" popover>
    <div class="project-delete-modal__backdrop"></div>
    <div class="project-delete-modal__content">

        <button class="project-delete-modal__close" popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide">
            &times;
        </button>
        
        <h2>Hapus Pengalaman?</h2>
        <p>Apakah kamu yakin ingin menghapus "<strong>{{ experience.title }}</strong>"? Tindakan ini tidak dapat dibatalkan.</p>
        
        <div class="project-delete-modal__actions">

            <button type="button" class="button-secondary" popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide">
                Batal
            </button>
            

            <form action="{% url 'main:delete_experience' experience.id %}" method="POST" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="button-danger">Hapus</button>
            </form>
        </div>
    </div>
</div>
